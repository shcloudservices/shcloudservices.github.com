services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shcloudservices-web:latest
    container_name: shcloudservices-web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DESTINATION_EMAIL=${DESTINATION_EMAIL:-contacto@solucioneshospedadas.com}
      - FROM_EMAIL=${FROM_EMAIL:-Soluciones Hospedadas <onboarding@resend.dev>}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
